<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/pokeball.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokémon Idle</title>
    <link rel="stylesheet" href="./assets/fonts.css">
    <link rel="stylesheet" href="./assets/style.css">
    <script>
      // Boot guard — runs before any module. If the game fails to start (an
      // incompatible save, a module error, or a hang), clear the save and
      // reload once so the player can never be permanently stuck. No console
      // needed. A session flag prevents a reload loop.
      ;(function () {
        // Keep in sync with SAVE_KEYS in src/data/config.js. The key includes a
        // schema version, so scan by prefix instead of hard-coding one.
        var SAVE_KEY_PREFIX = 'pokemon-idle-save'
        var FLAG = 'pokemon-idle-recovery-attempts'
        var BOOT_BACKUP_KEY = 'pi-save-boot-backup'
        var recovering = false
        window.__piBooted = false

        function liveSaveKeys() {
          var keys = []
          try {
            for (var i = 0; i < localStorage.length; i++) {
              var key = localStorage.key(i)
              if (key && key.indexOf(SAVE_KEY_PREFIX) === 0) keys.push(key)
            }
          } catch (e) {}
          return keys
        }

        // Copy every save (and the active-slot marker) aside before anything
        // clears them, so a startup failure can never permanently destroy
        // progress. Recoverable from the console with
        // pokemonIdleRestoreBootBackup().
        function backupSaves() {
          try {
            var keys = liveSaveKeys()
            if (keys.length === 0) return
            var snapshot = {}
            for (var i = 0; i < keys.length; i++) {
              snapshot[keys[i]] = localStorage.getItem(keys[i])
            }
            var activeSlot = localStorage.getItem('pokemon-idle-active-slot')
            localStorage.setItem(
              BOOT_BACKUP_KEY,
              JSON.stringify({ savedAt: Date.now(), activeSlot: activeSlot, saves: snapshot })
            )
          } catch (e) {}
        }

        function clearSaves() {
          var keys = liveSaveKeys()
          for (var i = 0; i < keys.length; i++) {
            try {
              localStorage.removeItem(keys[i])
            } catch (e) {}
          }
        }

        function showMessage(text) {
          var root = document.getElementById('root')
          if (root) {
            root.innerHTML =
              '<div style="font-family:monospace;font-size:14px;color:#e8dcc0;background:#1a1208;' +
              'padding:48px 24px;text-align:center;line-height:1.6">' +
              text +
              '</div>'
          }
        }

        function recover(reason) {
          if (recovering) return
          recovering = true
          var attempts = 0
          try {
            attempts = Number(sessionStorage.getItem(FLAG) || '0')
          } catch (e) {}
          try {
            console.warn('[pokemon-idle] startup failed (' + reason + '), attempt ' + (attempts + 1))
          } catch (e) {}
          if (attempts >= 2) {
            showMessage(
              'Pokemon Idle could not start.<br>Please clear this site\'s data in your browser settings, then reload.'
            )
            return
          }
          try {
            sessionStorage.setItem(FLAG, String(attempts + 1))
          } catch (e) {}
          backupSaves()
          // The first failure may be transient (a flaky network or a service
          // worker hiccup), so reload once without touching the save. Only a
          // repeat failure is treated as a stuck save and cleared.
          if (attempts === 0) {
            showMessage('Reloading&hellip;')
            setTimeout(function () {
              location.reload()
            }, 800)
            return
          }
          clearSaves()
          showMessage('Resetting save data and reloading&hellip;')
          setTimeout(function () {
            location.reload()
          }, 800)
        }

        window.addEventListener('error', function () {
          if (!window.__piBooted) recover('error')
        })
        window.addEventListener('unhandledrejection', function () {
          if (!window.__piBooted) recover('rejection')
        })
        setTimeout(function () {
          if (window.__piBooted) return
          // only force a recovery on timeout if there's actually a save to clear
          if (liveSaveKeys().length > 0) recover('timeout')
        }, 15000)
      })()
    </script>
    <script type="module" src="./assets/gameDataInjector.js"></script>
    <script type="module" src="./src/main.js"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
